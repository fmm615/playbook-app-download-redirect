<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbfaff" />
    <meta
      name="description"
      content="Download PLAYBOOK for iPhone or Android, or open it on the web."
    />
    <title>Download PLAYBOOK</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fbfaff;
        color: #221c2c;
        --ink: #221c2c;
        --body-ink: #544e60;
        --hair: #ece8f0;
        --paper: #fff;
        --purple: #7c5cd4;
        --purple-deep: #5a3fac;
        --purple-soft: #f1ecfb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 280px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: linear-gradient(165deg, #fff 0%, #fbfaff 45%, #fff 75%, #f7fbf9 100%);
      }

      main {
        width: min(100%, 500px);
        padding: clamp(28px, 7vw, 48px);
        text-align: center;
        background: var(--paper);
        border: 1px solid var(--hair);
        border-radius: 24px;
        box-shadow: 0 24px 70px rgba(34, 28, 44, 0.07);
      }

      .brand {
        width: min(100%, 340px);
        aspect-ratio: 3.4 / 1;
        margin: 0 auto 20px;
        overflow: hidden;
      }

      .brand img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .intro {
        margin: 16px 0 0;
        color: var(--body-ink);
        font-size: 17px;
        line-height: 1.55;
      }

      .download-options {
        display: grid;
        gap: 12px;
        margin-top: 24px;
      }

      .option-link {
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--hair);
        border-radius: 13px;
        background: var(--paper);
        color: var(--ink);
        font-size: clamp(15px, 4vw, 16px);
        font-weight: 650;
        line-height: 1.35;
        text-align: left;
        text-decoration: none;
        touch-action: manipulation;
        transition: background-color 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      }

      .option-link:hover {
        background: var(--purple-soft);
        border-color: var(--purple);
        box-shadow: 0 8px 22px rgba(124, 92, 212, 0.1);
      }

      .option-link:focus-visible {
        outline: 3px solid var(--purple-deep);
        outline-offset: 4px;
      }

      .arrow {
        flex: none;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--purple-soft);
        color: var(--purple-deep);
        font-size: 19px;
        font-weight: 400;
        line-height: 1;
      }

      .note {
        min-height: 42px;
        margin: 24px 0 0;
        color: var(--body-ink);
        font-size: 13px;
        line-height: 1.6;
      }

      @media (prefers-reduced-motion: reduce) {
        .option-link {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="42.png" alt="PLAYBOOK" width="800" height="800" />
      </div>

      <p class="intro">Get the PLAYBOOK app on your device.</p>
      <p class="note" id="redirect-note" role="status" aria-live="polite">
        If you are not redirected automatically, choose an option below.
      </p>

      <nav class="download-options" aria-label="PLAYBOOK options">
        <a
          class="option-link"
          href="https://apps.apple.com/bh/app/playbook-network/id1622077073"
        >
          <span>Download on the App Store</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a
          class="option-link"
          href="https://play.google.com/store/apps/details?id=com.mightybell.playbook"
        >
          <span>Download on Google Play</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="option-link" href="https://app.get-playbook.com/app">
          <span>Open Web Version</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </main>

    <script>
      (function () {
        var userAgent = navigator.userAgent || "";
        var destination = null;
        var storeName = "";

        if (/Android/i.test(userAgent)) {
          destination = "https://play.google.com/store/apps/details?id=com.mightybell.playbook";
          storeName = "Google Play";
        } else if (
          /iPhone|iPad|iPod/i.test(userAgent) ||
          (/Macintosh/i.test(userAgent) && navigator.maxTouchPoints > 1)
        ) {
          destination = "https://apps.apple.com/bh/app/playbook-network/id1622077073";
          storeName = "the App Store";
        }

        if (destination) {
          document.getElementById("redirect-note").textContent =
            "Taking you to " + storeName + "… If you are not redirected automatically, choose your store below.";

          window.setTimeout(function () {
            window.location.replace(destination);
          }, 900);
        }
      })();
    </script>
  </body>
</html>
