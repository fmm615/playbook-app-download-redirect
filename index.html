<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbfaff" />
    <meta name="apple-itunes-app" content="app-id=1622077073" />
    <meta
      name="description"
      content="Download PLAYBOOK for iPhone or Android, or open it on the web."
    />
    <title>Download PLAYBOOK</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fbfaff;
        color: #221c2c;
        --ink: #221c2c;
        --body-ink: #544e60;
        --hair: #ece8f0;
        --paper: #fff;
        --purple: #7c5cd4;
        --purple-deep: #5a3fac;
        --purple-soft: #f1ecfb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 280px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: linear-gradient(165deg, #fff 0%, #fbfaff 45%, #fff 75%, #f7fbf9 100%);
      }

      main {
        width: min(100%, 500px);
        padding: clamp(28px, 7vw, 48px);
        text-align: center;
        background: var(--paper);
        border: 1px solid var(--hair);
        border-radius: 24px;
        box-shadow: 0 24px 70px rgba(34, 28, 44, 0.07);
      }

      .brand {
        width: min(100%, 340px);
        aspect-ratio: 3.4 / 1;
        margin: 0 auto 20px;
        overflow: hidden;
      }

      .brand img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .intro {
        margin: 16px 0 0;
        color: var(--body-ink);
        font-size: 17px;
        line-height: 1.55;
      }

      .download-options {
        display: grid;
        gap: 12px;
        margin-top: 24px;
      }

      .option-link {
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--hair);
        border-radius: 13px;
        background: var(--paper);
        color: var(--ink);
        font-size: clamp(15px, 4vw, 16px);
        font-weight: 650;
        line-height: 1.35;
        text-align: left;
        text-decoration: none;
        touch-action: manipulation;
        transition: background-color 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      }

      .option-link:hover {
        background: var(--purple-soft);
        border-color: var(--purple);
        box-shadow: 0 8px 22px rgba(124, 92, 212, 0.1);
      }

      .option-link:focus-visible {
        outline: 3px solid var(--purple-deep);
        outline-offset: 4px;
      }

      .whatsapp-link {
        color: #146c43;
        border-color: #bce5cf;
        background: #f2fbf6;
      }

      .whatsapp-link:hover {
        background: #e7f8ee;
        border-color: #128c7e;
        box-shadow: 0 8px 22px rgba(18, 140, 126, 0.1);
      }

      .whatsapp-label {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .whatsapp-icon {
        flex: none;
        width: 26px;
        height: 26px;
        fill: currentColor;
      }

      .whatsapp-link .arrow {
        background: #e2f5e9;
        color: #146c43;
      }

      .arrow {
        flex: none;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--purple-soft);
        color: var(--purple-deep);
        font-size: 19px;
        font-weight: 400;
        line-height: 1;
      }

      .note {
        min-height: 42px;
        margin: 24px 0 0;
        color: var(--body-ink);
        font-size: 13px;
        line-height: 1.6;
      }

      @media (prefers-reduced-motion: reduce) {
        .option-link {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="42.png" alt="PLAYBOOK" width="800" height="800" />
      </div>

      <p class="intro">Get the PLAYBOOK app on your device.</p>
      <p class="note" id="redirect-note" role="status" aria-live="polite">
        If you are not redirected automatically, choose an option below.
      </p>

      <nav class="download-options" aria-label="PLAYBOOK options">
        <a
          class="option-link"
          data-destination="apple"
          href="https://apps.apple.com/bh/app/playbook-network/id1622077073"
        >
          <span>Download on the App Store</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a
          class="option-link"
          data-destination="google"
          href="https://play.google.com/store/apps/details?id=com.mightybell.playbook"
        >
          <span>Download on Google Play</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="option-link" data-destination="web" href="https://app.get-playbook.com/app">
          <span>Open Web Version</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="option-link whatsapp-link" href="https://wa.me/97338227733">
          <span class="whatsapp-label">
            <!-- WhatsApp mark from Simple Icons (CC0). -->
            <svg class="whatsapp-icon" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" />
            </svg>
            <span>Chat with us on WhatsApp</span>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </main>

    <script src="tracking-config.js"></script>
    <script src="download.js"></script>
  </body>
</html>
