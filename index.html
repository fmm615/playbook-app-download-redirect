<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5ef" />
    <meta
      name="description"
      content="Download the PLAYBOOK app for iPhone, iPad, or Android."
    />
    <title>Download PLAYBOOK</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f5ef;
        color: #171714;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 280px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: radial-gradient(circle at 50% 0%, #fffdf8 0, #f7f5ef 68%);
      }

      main {
        width: min(100%, 480px);
        padding: clamp(30px, 7vw, 52px);
        text-align: center;
        background: #fff;
        border: 1px solid #e9e5db;
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(34, 29, 18, 0.07);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 42px;
        color: #5e4b2d;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.2em;
      }

      .brand-mark {
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        border: 1px solid currentColor;
        border-radius: 7px;
        font-size: 15px;
        line-height: 1;
        letter-spacing: 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 8vw, 46px);
        font-weight: 750;
        letter-spacing: -0.055em;
        line-height: 1.08;
      }

      .intro {
        margin: 18px 0 0;
        color: #595852;
        font-size: 17px;
        line-height: 1.5;
      }

      .store-links {
        display: grid;
        gap: 12px;
        margin-top: 22px;
      }

      .store-link {
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        border: 1px solid #171714;
        border-radius: 14px;
        background: #171714;
        color: #fff;
        font-size: 16px;
        font-weight: 650;
        line-height: 1.25;
        text-align: left;
        text-decoration: none;
        transition: background-color 180ms ease, transform 180ms ease;
      }

      .store-link:hover {
        background: #38362f;
        transform: translateY(-2px);
      }

      .store-link:focus-visible,
      .website-link:focus-visible {
        outline: 3px solid #9b7537;
        outline-offset: 4px;
      }

      .arrow {
        flex: none;
        font-size: 20px;
        font-weight: 400;
        line-height: 1;
      }

      .note {
        min-height: 42px;
        margin: 30px 0 0;
        color: #67655e;
        font-size: 13px;
        line-height: 1.6;
      }

      .website-link {
        display: inline-block;
        margin-top: 18px;
        color: #5e4b2d;
        font-size: 13px;
        font-weight: 650;
        text-underline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .store-link {
          transition: none;
        }

        .store-link:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-label="PLAYBOOK">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span>PLAYBOOK</span>
      </div>

      <h1>Download PLAYBOOK</h1>
      <p class="intro">Get the PLAYBOOK app on your device.</p>
      <p class="note" id="redirect-note" role="status" aria-live="polite">
        If you are not redirected automatically, choose your store below.
      </p>

      <nav class="store-links" aria-label="App download links">
        <a
          class="store-link"
          href="https://apps.apple.com/bh/app/playbook-network/id1622077073"
        >
          <span>Download on the App Store</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a
          class="store-link"
          href="https://play.google.com/store/apps/details?id=com.mightybell.playbook"
        >
          <span>Get it on Google Play</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
      <a class="website-link" href="https://www.get-playbook.com/">
        Visit the PLAYBOOK website
      </a>
    </main>

    <script>
      (function () {
        var userAgent = navigator.userAgent || "";
        var destination = null;
        var storeName = "";

        if (/Android/i.test(userAgent)) {
          destination = "https://play.google.com/store/apps/details?id=com.mightybell.playbook";
          storeName = "Google Play";
        } else if (
          /iPhone|iPad|iPod/i.test(userAgent) ||
          (/Macintosh/i.test(userAgent) && navigator.maxTouchPoints > 1)
        ) {
          destination = "https://apps.apple.com/bh/app/playbook-network/id1622077073";
          storeName = "the App Store";
        }

        if (destination) {
          document.getElementById("redirect-note").textContent =
            "Taking you to " + storeName + "… If you are not redirected automatically, choose your store below.";

          window.setTimeout(function () {
            window.location.replace(destination);
          }, 900);
        }
      })();
    </script>
  </body>
</html>
